<body>
<header class="mast"><div class="mast-inner"><div class="edition">页面方案体验稿</div><h1>本周事项</h1><p>先确定页面怎么用，再看看页面是什么感觉。每一步都只需要比较眼前的页面。</p></div></header>
<nav class="stage-nav" aria-label="体验步骤"><button id="step-structure" class="active" type="button">1. 先确定页面怎么用</button><button id="step-style" type="button" disabled hidden>2. 再选择页面感觉</button></nav>
<main class="workspace">
<section class="stage" id="stage-structure" aria-labelledby="structure-title"><div class="stage-copy"><h2 id="structure-title">先确定页面怎么用</h2><p>下面三个方案使用同一组工作内容，只是进入页面后的重点不同。选一个你觉得更自然的方式。</p></div><nav class="direction-nav" id="directions" aria-label="页面方案"></nav></section>
<section class="stage" id="stage-style" aria-labelledby="style-title" hidden><div class="stage-copy"><h2 id="style-title">再选择页面感觉</h2><p>页面内容和使用方式已经固定。现在只比较整体视觉，不需要理解颜色或字体名称。</p></div><nav class="style-nav" id="styles" aria-label="视觉风格"></nav></section>
<section class="preview ds-surface" id="preview" aria-label="页面方案预览"><div class="preview-head"><div><span class="preview-kicker" id="preview-kicker">当前页面方案</span><h2 id="direction-label">方案一</h2><p id="direction-summary"></p></div><span class="preview-note">示例内容 · 可点击体验</span></div><div class="scene" id="scene"></div><p class="interaction-status" id="interaction-status" role="status"></p></section>

  const catalog=styleCatalog();
  for(const [id,style] of Object.entries(catalog)){
    const button=document.createElement('button');button.type='button';button.dataset.style=id;button.setAttribute('aria-pressed',String(id===activeStyle));
    const strong=document.createElement('strong');const small=document.createElement('small');strong.textContent=style.label;small.textContent=style.summary;button.append(strong,small);button.addEventListener('click',()=>setStyle(id));byId('styles').append(button);
  }
}
function setStage(stage){
  if(stage==='style'&&!structureConfirmed)return;
  activeStage=stage;
  const structure=stage==='structure';
  byId('stage-structure').hidden=!structure;
  byId('stage-style').hidden=structure;
  byId('step-structure').classList.toggle('active',structure);
  byId('step-style').classList.toggle('active',!structure);
  byId('step-structure').setAttribute('aria-current',structure?'step':'false');
  byId('step-style').setAttribute('aria-current',structure?'false':'step');
  byId('step-style').disabled=!structureConfirmed;
  byId('step-style').hidden=!structureConfirmed;
  byId('back-structure').hidden=structure;
  byId('continue-style').textContent=structure?'确定这个页面方式，看看视觉':'确认这个页面感觉';
  byId('preview-kicker').textContent=structure?'当前页面方案':'当前页面感觉';
  if(!structure){renderStyles();applyTheme();updateUrl();byId('direction-summary').textContent=directions[activeDirection].summary+' 当前感觉：'+styleCatalog()[activeStyle].label+'。';}
  else{applyTheme('clear');byId('direction-summary').textContent=directions[activeDirection].summary;byId('interaction-status').textContent='可以重新选择页面方式。';}
}
for(const [id,direction] of Object.entries(directions)){
  const button=document.createElement('button');button.type='button';button.dataset.direction=id;button.setAttribute('aria-pressed','false');
  const strong=document.createElement('strong');const small=document.createElement('small');strong.textContent=direction.label;small.textContent=direction.summary;button.append(strong,small);button.addEventListener('click',()=>setDirection(id));byId('directions').append(button);
}
byId('step-structure').addEventListener('click',()=>setStage('structure'));
byId('step-style').addEventListener('click',()=>setStage('style'));
byId('continue-style').addEventListener('click',()=>{
  if(activeStage==='structure'){
    structureConfirmed=true;
    byId('step-style').disabled=false;
    renderStyles();
    setStage('style');
    byId('interaction-status').textContent='页面方式已确定，现在比较同一个页面的三种感觉。';
  }else{
    byId('interaction-status').textContent='已记录“'+styleCatalog()[activeStyle].label+'”作为当前页面感觉。';
  }
});
byId('back-structure').addEventListener('click',()=>setStage('structure'));
setDirection(activeDirection);
setStage('structure');
</script>
</script>
</body></html>
