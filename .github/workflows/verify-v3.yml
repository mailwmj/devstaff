name: Verify v3 bundle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run v3 workflow tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s v3/tests -p 'test_*.py'

      - name: Run v3 design tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s v3/site-design/scripts/tests -p 'test_*.py'

      - name: Validate v3 design assets
        run: PYTHONDONTWRITEBYTECODE=1 python3 v3/site-design/scripts/design.py validate

      - name: Verify v3 from clean archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_FILE="$(mktemp)"
          RELEASE_DIR="$(mktemp -d)"
          INSTALL_DIR="$(mktemp -d)"
          git archive --format=tar HEAD --output="$ARCHIVE_FILE"
          tar -xf "$ARCHIVE_FILE" -C "$RELEASE_DIR"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s "$RELEASE_DIR/v3/tests" -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 "$RELEASE_DIR/v3/site-design/scripts/design.py" validate
          python3 "$RELEASE_DIR/v3/install.py" "$INSTALL_DIR"
          test -f "$INSTALL_DIR/site-design-v3/references/surface-brief.md"
