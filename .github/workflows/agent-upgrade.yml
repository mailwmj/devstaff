name: Roadmap integration
on:
  push:
    branches: ['agent/devstaff-complete-20260919']
    paths: ['.github/workflows/agent-upgrade.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/devstaff-complete-20260919'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/devstaff-complete-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact integration corrections
        run: |
          set -euo pipefail
          python3 tools/fix_integration.py
          rm tools/fix_integration.py
          git config user.name 'devstaff implementation agent'
          git config user.email 'devstaff-agent@users.noreply.github.com'
          git add -A -- . ':!.github'
          git commit -m 'fix: align supported schema and scan boundaries; diagnose browser failures'
          git push origin HEAD:refs/heads/agent/devstaff-complete-20260919
      - name: Install test-only browser dependencies
        run: |
          python3 -m pip install -r release/site-check/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Run full integration validation
        run: python3 tools/verify_all.py --browser
      - name: Upload all evidence and complete project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devstaff-integration-corrected
          include-hidden-files: true
          path: |
            .verification/
            dist/skill.zip
            dist/devstaff-project.zip
          if-no-files-found: warn
