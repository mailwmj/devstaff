name: Verify release bundle
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: All suites and clean release with installation source removed
        run: python3 tools/verify_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.python-version }}
          path: |
            .verification/
            dist/skill.zip
            dist/devstaff-project.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only browser dependencies
        run: |
          python3 -m pip install -r release/site-check/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Isolated browser, data and release regression
        run: python3 tools/verify_all.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            .verification/
            dist/skill.zip
            dist/devstaff-project.zip
