name: Final compatibility integration
on:
  push:
    branches: ['agent/devstaff-complete-20260919']
    paths: ['.github/workflows/compat-fix.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/agent/devstaff-complete-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/devstaff-complete-20260919
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tested compatibility changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast
          R=Path.cwd()
          def edit(name, old, new):
              p=R/name;s=p.read_text(encoding='utf-8');assert old in s,name;s=s.replace(old,new,1)
              if p.suffix=='.py':ast.parse(s)
              p.write_text(s,encoding='utf-8')
          edit('release/site-check/scripts/check.py',"        if current_state.get('schema_revision', 1) >= 3:\n            round_id = (current_state.get('verification') or {}).get('round_id')", "        if not isinstance(current_state, dict):\n            raise ValueError('state must be a JSON object')\n        revision = current_state.get('schema_revision', 1)\n        if type(revision) is not int or revision not in (1, 2, 3):\n            raise ValueError('unsupported state schema_revision')\n        if revision >= 3:\n            verification = current_state.get('verification') or {}\n            if not isinstance(verification, dict):\n                raise ValueError('state verification must be an object')\n            round_id = verification.get('round_id')")
          edit('release/site-builder/scripts/state.py',"    decision=state.get('decision')\n", "    if 'decision' not in state and revision < 3 and state['stage'] == 'discovering':\n        state['decision'] = {'confirmed': False, 'task': '', 'direction': '', 'include': [], 'exclude': [], 'quote': ''}\n    decision=state.get('decision')\n")
          edit('tests/test_install_hardening.py',"            shutil.copy2(ROOT / 'release' / name / 'scripts' / script, folder / script)\n        installer.install(self.root, self.dest)","            shutil.copy2(ROOT / 'release' / name / 'scripts' / script, folder / script)\n        # The runtime is a shipped dependency, not a file from the install source.\n        shutil.copytree(ROOT / 'release/site-builder/scripts/site_runtime',\n                        self.root / 'site-builder/scripts/site_runtime')\n        installer.install(self.root, self.dest)")
          p=R/'tests/test_cli.py';s=p.read_text();start=s.index('    def test_reused_quote_rejected_by_cli');end=s.index('\n\nif __name__',start);segment=s[start:end]
          segment=segment.replace('test_reused_quote_rejected_by_cli','test_separate_confirmations_may_repeat_the_same_words').replace('expected=2,','expected=0,')
          segment=segment.replace('            self.assertIn("error", result)\n            self.assertIn("quote", result["error"])','            self.assertEqual(result["stage"], "decided")\n            stored = json.loads((root / ".site/state.json").read_text(encoding="utf-8"))\n            self.assertEqual(stored["decision"]["quote"], stored["discovery"]["structure"]["quote"])')
          s=s[:start]+segment+s[end:];ast.parse(s);p.write_text(s)
          p=R/'release/site-design/SKILL.md';s=p.read_text();refs=p.parent/'references'
          rows=[('A1','Establish task context','design-context.md'),('A2','Develop a grounded direction','visual-direction.md'),('A3','Render the necessary experiment','prototype.md'),('A4','Export approved tokens','design-tokens.md'),('A5','Review the actual render','craft-review.md'),('B1','Establish task context','design-context.md'),('B2','Arrange truthful conversion content','landing-page.md'),('B3','Develop a grounded direction','visual-direction.md'),('B4','Render the necessary experiment','prototype.md'),('B5','Review the actual render','craft-review.md')]
          names={row[2] for row in rows};sizes=[(refs/n).stat().st_size for n in names]
          section='\n## 按步骤读，不要一次读完\n\n'
          section+='The design paths below load one reference per step. Read the next step only when needed; skip inapplicable stages. A is a product surface; B is a conversion page.\n\n'
          section+=f'合计约 {round(sum(sizes)/1024)}KB，单步最大 {max(round(n/1024) for n in sizes)}KB。\n\n'
          section+=f'[Contract](references/surface-brief.md)（{round((refs/"surface-brief.md").stat().st_size/1024)}KB） is the shared artifact; read once and update only applicable sections.\n\n'
          section+='| Step | Purpose | Read | Size |\n| --- | --- | --- | --- |\n'
          for step,purpose,name in rows:section+=f'| {step} | {purpose} | [{name[:-3]}](references/{name}) | {round((refs/name).stat().st_size/1024)}KB |\n'
          s+=section;p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'devstaff implementation agent'
          git config user.email 'devstaff-agent@users.noreply.github.com'
          git add release/site-check/scripts/check.py release/site-builder/scripts/state.py tests/test_install_hardening.py tests/test_cli.py release/site-design/SKILL.md
          git commit -m 'fix: preserve legacy discovery and staged design loading without weakening gates'
          git push origin HEAD:refs/heads/agent/devstaff-complete-20260919
      - name: Install optional browser tooling
        run: |
          python3 -m pip install -r release/site-check/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Validate whole project and release
        run: python3 tools/verify_all.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-project-validation
          include-hidden-files: true
          path: |
            .verification/
            dist/skill.zip
            dist/devstaff-project.zip
