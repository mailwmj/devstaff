<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="可运行的本地轻量工具，支持记录管理与本地备份。">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="可运行的本地轻量工具，支持记录管理与本地备份。">
  <meta property="og:image" content="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>{{TITLE}}</h1>
      <p>这是一个可运行的中性工具起点。新增、查看、编辑和反馈需要按真实任务确定。</p>
    </header>
    <section aria-labelledby="add-title">
      <h2 id="add-title">新增内容</h2>
      <form id="entry-form">
        <label for="entry">内容</label>
        <div class="entry-row">
          <input id="entry" name="entry" required maxlength="200" autocomplete="off">
          <button type="submit">保存</button>
        </div>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">已保存内容</h2>
        <span id="count"></span>
      </div>
      <p id="empty">还没有内容。添加第一条记录。</p>
      <ul id="entries"></ul>
    </section>
    <section id="edit-panel" aria-labelledby="edit-title" hidden>
      <h2 id="edit-title">编辑记录</h2>
      <form id="edit-form">
        <label for="edit-entry">内容</label>
        <div class="entry-row">
          <input id="edit-entry" name="edit-entry" required maxlength="200" autocomplete="off">
          <button type="submit">保存修改</button>
          <button id="cancel-edit" type="button" class="secondary">取消</button>
        </div>
      </form>
    </section>
    <section aria-labelledby="backup-title">
      <h2 id="backup-title">数据备份</h2>
      <p>记录仅保存在当前浏览器和网址下。导出文件可以备份或转移记录。</p>
      <div class="actions">
        <button id="export" type="button" class="secondary">导出备份</button>
        <label class="file-label" for="import">导入备份文件
          <input type="file" id="import" accept="application/json,.json">
        </label>
      </div>
      <div id="import-review" hidden>
        <p id="import-summary"></p>
        <button id="apply-import" type="button">合并这些记录</button>
        <button id="cancel-import" type="button" class="secondary">取消</button>
      </div>
    </section>
  </main>
  <footer>可运行工具起点 · 业务规则需要按真实需求实现和验收</footer>
</body>
</html>
